services:
  - type: web
    name: easyprint-routing-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://lordcarvel.github.io,easyhub://app
      - key: ROUTING_STORE_MODE
        value: sqlite
      - key: ROUTING_DB_PATH
        value: /tmp/easyprint-routing.sqlite
